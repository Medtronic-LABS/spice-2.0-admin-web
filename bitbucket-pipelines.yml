options:
  max-time: 60

definitions:
  oidc: &bitbucket-oidc
    audiences:
      - ari:cloud:bitbucket::workspace/25d4da96-4791-4b12-9b73-a2308af9ff35

  caches:
    npm: ~/.npm

  steps:
    # Step 1: Install & Test – produces coverage and node_modules for Sonar and Build
    - step: &install-test
        name: Install & Test
        image: node:22.14.0
        caches:
          - npm
        script:
          - set -e
          - export CI=false
          - npm ci
          - npm run test || echo "Tests failed but continuing..."
        artifacts:
          - coverage/**
          - node_modules/**
          - test-report.xml

    # Step 2: Sonar – uses sonar-scanner image and coverage artifact
    - step: &sonar
        name: Sonar
        image: sonarsource/sonar-scanner-cli:latest
        script:
          - >
            sonar-scanner
            -Dsonar.projectKey=${SONAR_PROJECT_KEY:-spice-uhis-web}
            -Dsonar.sources=./src
            -Dsonar.tests=./src
            -Dsonar.test.inclusions=*.test.{ts,tsx}
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.testExecutionReportPaths=test-report.xml
            -Dsonar.qualitygate.wait=true
        # SONAR_HOST_URL, SONAR_TOKEN from Bitbucket vars; SONAR_PROJECT_KEY set per branch below

    # Step 3: Build – uses node_modules artifact from Install & Test (no second npm ci)
    - step: &build
        name: Build
        image: node:22.14.0
        caches:
          - npm
        script:
          - export CI=false
          - |
            if [ -d "node_modules" ]; then
              echo "[OK] node_modules found from previous artifact. Skipping install."
            else
              echo "[INFO] node_modules missing. Installing dependencies..."
              npm ci
            fi
          - npm run build
        artifacts:
          - build/**

    # Step 4a: Dev/QA deploy — shared AWS account (uhis-dev + uhis-qa)
    # Set AWS_OIDC_ROLE on deployment: uhis-dev, uhis-qa
    - step: &deploy-s3-cf-dev-qa
        name: Upload to S3 & Invalidate CloudFront (Dev/QA)
        image: amazon/aws-cli:2.15.0
        oidc: *bitbucket-oidc
        script:
          - set -e
          - |
            if [ -z "${AWS_OIDC_ROLE:-}" ]; then
              echo "ERROR AWS_OIDC_ROLE is required for dev/qa deploy"
              exit 1
            fi
          - export AWS_ROLE_ARN="${AWS_OIDC_ROLE}"
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo "${BITBUCKET_STEP_OIDC_TOKEN}" > "${AWS_WEB_IDENTITY_TOKEN_FILE}"
          - echo "Using dev/qa OIDC role ${AWS_ROLE_ARN}"
          - aws sts get-caller-identity
          - aws s3 sync build/ s3://${AWS_S3_BUCKET}/ --delete --exact-timestamps --exclude "index.html" --cache-control "max-age=31536000,public"
          - aws s3 cp build/index.html s3://${AWS_S3_BUCKET}/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate"
          - aws --no-cli-pager cloudfront create-invalidation --distribution-id ${CF_DIST_ID} --paths "/*" --output text --query "Invalidation.Id"
          - rm -f "${AWS_WEB_IDENTITY_TOKEN_FILE}"

    # Step 4b: Training deploy — separate AWS account
    # Set AWS_OIDC_ROLE_TRAINING (or AWS_OIDC_ROLE) on deployment: uhis-training
    - step: &deploy-s3-cf-training
        name: Upload to S3 & Invalidate CloudFront (Training)
        image: amazon/aws-cli:2.15.0
        oidc: *bitbucket-oidc
        script:
          - set -e
          - |
            if [ -z "${AWS_OIDC_ROLE_TRAINING:-}" ] && [ -z "${AWS_OIDC_ROLE:-}" ]; then
              echo "ERROR AWS_OIDC_ROLE_TRAINING (or AWS_OIDC_ROLE) is required for training deploy"
              exit 1
            fi
          - export AWS_ROLE_ARN="${AWS_OIDC_ROLE_TRAINING:-${AWS_OIDC_ROLE}}"
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo "${BITBUCKET_STEP_OIDC_TOKEN}" > "${AWS_WEB_IDENTITY_TOKEN_FILE}"
          - echo "Using training OIDC role ${AWS_ROLE_ARN}"
          - aws sts get-caller-identity
          - aws s3 sync build/ s3://${AWS_S3_BUCKET}/ --delete --exact-timestamps --exclude "index.html" --cache-control "max-age=31536000,public"
          - aws s3 cp build/index.html s3://${AWS_S3_BUCKET}/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate"
          - aws --no-cli-pager cloudfront create-invalidation --distribution-id ${CF_DIST_ID} --paths "/*" --output text --query "Invalidation.Id"
          - rm -f "${AWS_WEB_IDENTITY_TOKEN_FILE}"

    # Step 4c: Deploy to GCP Training via Workload Identity Federation
    # Required deployment variables on uhis-gcp-training:
    #   GCP_PROJECT_ID, GCP_PROJECT_NUMBER, WIF_POOL_ID, WIF_PROVIDER_ID
    #   GCP_SERVICE_ACCOUNT, GCS_BUCKET, URL_MAP_NAME
    - step: &deploy-gcp-training
        name: Upload to GCS & Invalidate CDN
        image: google/cloud-sdk:slim
        oidc: true
        script:
          - set -e
          - echo "$BITBUCKET_STEP_OIDC_TOKEN" > oidc-token
          - |
            gcloud iam workload-identity-pools create-cred-config \
              projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID} \
              --service-account=${GCP_SERVICE_ACCOUNT} \
              --credential-source-file=oidc-token \
              --output-file=gcp-creds.json
          - export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-creds.json
          - gcloud auth login --cred-file=gcp-creds.json
          - gcloud config set project ${GCP_PROJECT_ID}
          - gsutil -m rsync -r -d build gs://${GCS_BUCKET}
          - |
            gsutil setmeta \
              -h "Cache-Control:no-cache,no-store,must-revalidate" \
              gs://${GCS_BUCKET}/index.html
          - |
            gcloud compute url-maps invalidate-cdn-cache \
              ${URL_MAP_NAME} \
              --path="/*" \
              --quiet
          - rm -f oidc-token gcp-creds.json

pipelines:
  pull-requests:
    "uhis-*":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
            - step:
                <<: *sonar
      - stage:
          name: Build
          deployment: uhis-dev
          steps:
            - step:
                <<: *build

    "feature/uhis-*":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
            - step:
                <<: *sonar
      - stage:
          name: Build
          deployment: uhis-dev
          steps:
            - step:
                <<: *build

  branches:
    "uhis-dev":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
            - step:
                <<: *sonar
      - stage:
          name: Build & Deploy to UHIS-DEV
          deployment: uhis-dev
          steps:
            - step:
                <<: *build
            - step:
                <<: *deploy-s3-cf-dev-qa

    "uhis-training":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
            - step:
                <<: *sonar
      - stage:
          name: Build & Deploy to UHIS-TRAINING
          deployment: uhis-training
          steps:
            - step:
                <<: *build
            - step:
                <<: *deploy-s3-cf-training

  # Manual pipelines
  # Dev/QA (shared AWS account): AWS_OIDC_ROLE, AWS_S3_BUCKET, CF_DIST_ID
  # Training AWS (uhis-training): AWS_OIDC_ROLE_TRAINING or AWS_OIDC_ROLE, AWS_S3_BUCKET, CF_DIST_ID
  # Training GCP (uhis-gcp-training): GCP_PROJECT_ID, GCP_PROJECT_NUMBER, WIF_POOL_ID, WIF_PROVIDER_ID, GCP_SERVICE_ACCOUNT, GCS_BUCKET, URL_MAP_NAME
  custom:
    deploy-uhis-qa:
      - stage:
          name: Build & Deploy to UHIS-QA
          deployment: uhis-qa
          steps:
            - step:
                <<: *build
            - step:
                <<: *deploy-s3-cf-dev-qa

    deploy-uhis-training:
      - stage:
          name: Build & Deploy to UHIS-TRAINING
          deployment: uhis-training
          steps:
            - step:
                <<: *build
            - step:
                <<: *deploy-s3-cf-training

    deploy-uhis-training-gcp:
      - stage:
          name: Build & Deploy to GCP Training
          deployment: uhis-gcp-training
          steps:
            - step:
                <<: *build
            - step:
                <<: *deploy-gcp-training
