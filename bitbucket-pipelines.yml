options:
  max-time: 60

definitions:
  caches:
    npm: ~/.npm

  # Runner for UHIS environment
  runner-uhis-dev: &runner-uhis-dev
    - self.hosted
    - linux
    - spice.uhis
    - ec2.runner

  steps:
    # Step 1: Install & Test – produces coverage and node_modules for Sonar and Build
    - step: &install-test
        name: Install & Test
        image: node:22.14.0
        caches:
          - npm
        script:
          - set -e
          - export CI=false
          - npm ci
          - npm run test || echo "Tests failed but continuing..."
        artifacts:
          - coverage/**
          - node_modules/**

    # Step 2: Sonar – uses sonar-scanner image and coverage artifact
    - step: &sonar
        name: Sonar
        image: sonarsource/sonar-scanner-cli:latest
        script:
          - >
            sonar-scanner
            -Dsonar.projectKey=${SONAR_PROJECT_KEY:-spice-uhis-web}
            -Dsonar.sources=./src
            -Dsonar.tests=./src
            -Dsonar.test.inclusions=*.test.{ts,tsx}
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        # SONAR_HOST_URL, SONAR_TOKEN from Bitbucket vars; SONAR_PROJECT_KEY set per branch below

    # Step 3: Build – uses node_modules artifact from Install & Test (no second npm ci)
    - step: &build
        name: Build
        image: node:22.14.0
        caches:
          - npm
        script:
          - export CI=false
          - |
            if [ -d "node_modules" ]; then
              echo "[OK] node_modules found from previous artifact. Skipping install."
            else
              echo "[INFO] node_modules missing. Installing dependencies..."
              npm ci
            fi
          - npm run build
        artifacts:
          - build/**

    # Step 4: Upload to S3 & Invalidate CloudFront
    - step: &deploy-s3-cf
        name: Upload to S3 & Invalidate CloudFront
        image: amazon/aws-cli:2.15.0
        script:
          - set -e
          # AWS_S3_BUCKET, CF_DIST_ID from deployment vars
          - aws s3 sync build/ s3://${AWS_S3_BUCKET}/ --delete --exact-timestamps --exclude "index.html" --cache-control "max-age=31536000,public"
          - aws s3 cp build/index.html s3://${AWS_S3_BUCKET}/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate"
          - aws --no-cli-pager cloudfront create-invalidation --distribution-id ${CF_DIST_ID} --paths "/*" --output text --query "Invalidation.Id"

    # step 5: Deploy to UHIS-TRAINING
    # OIDC deploy: use same audience in AWS IdP and in the IAM role trust policy.
    - step: &deploy-s3-cf-training
        name: Upload to S3 & Invalidate CloudFront
        image: amazon/aws-cli:2.15.0
        oidc:
          audiences:
            - ari:cloud:bitbucket::workspace/25d4da96-4791-4b12-9b73-a2308af9ff35
        script:
          - set -e

          # Configure AWS OIDC authentication
          - export AWS_ROLE_ARN=$AWS_OIDC_ROLE
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token
          - aws sts get-caller-identity
          # AWS_S3_BUCKET, CF_DIST_ID from deployment vars
          - aws s3 sync build/ s3://${AWS_S3_BUCKET}/ --delete --exact-timestamps --exclude "index.html" --cache-control "max-age=31536000,public"
          - aws s3 cp build/index.html s3://${AWS_S3_BUCKET}/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate"
          - aws --no-cli-pager cloudfront create-invalidation --distribution-id ${CF_DIST_ID} --paths "/*" --output text --query "Invalidation.Id"
          - rm -f $(pwd)/web-identity-token

pipelines:
  pull-requests:
    "uhis-*":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
                runs-on: *runner-uhis-dev
            - step:
                <<: *sonar
                runs-on: *runner-uhis-dev
      - stage:
          name: Build
          deployment: uhis-dev
          steps:
            - step:
                <<: *build
                runs-on: *runner-uhis-dev

    "feature/uhis-*":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
                runs-on: *runner-uhis-dev
            - step:
                <<: *sonar
                runs-on: *runner-uhis-dev
      - stage:
          name: Build
          deployment: uhis-dev
          steps:
            - step:
                <<: *build
                runs-on: *runner-uhis-dev

  branches:
    "uhis-dev":
      - stage:
          name: Install, Test & Sonar
          steps:
            - step:
                <<: *install-test
                runs-on: *runner-uhis-dev
            - step:
                <<: *sonar
                runs-on: *runner-uhis-dev
      - stage:
          name: Build & Deploy to UHIS-DEV
          deployment: uhis-dev
          steps:
            - step:
                <<: *build
                runs-on: *runner-uhis-dev
            - step:
                <<: *deploy-s3-cf
                runs-on: *runner-uhis-dev

  # Manual pipeline: Build & Deploy to UHIS-QA
  # Required deployment variables for 'uhis-qa':
  #   - AWS_S3_BUCKET: S3 bucket for QA environment (e.g., spice-web-uhis-qa)
  #   - CF_DIST_ID: CloudFront distribution ID for QA environment
  custom:
    deploy-uhis-qa:
      - stage:
          name: Build & Deploy to UHIS-QA
          deployment: uhis-qa
          steps:
            - step:
                <<: *build
                runs-on: *runner-uhis-dev
            - step:
                <<: *deploy-s3-cf
                runs-on: *runner-uhis-dev
    deploy-uhis-training:
      - stage:
          name: Build & Deploy to UHIS-TRAINING
          deployment: uhis-training
          steps:
            - step:
                <<: *build
                runs-on: *runner-uhis-dev
            - step:
                <<: *deploy-s3-cf-training
                runs-on: *runner-uhis-dev
